<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>try{var t=localStorage.getItem("otiva_theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<title>Разместить объявление — OTIVA</title>
<link rel="stylesheet" href="../css/styles.css" />
<link rel="stylesheet" href="../css/listing-form.css" />
</head>
<body>
<header class="site-header" id="app-header"></header>

<main>
  <section class="section">
    <div class="container form-wrap">
      <div class="card form-card">
        <h1 id="form-title" class="mt-0">Новое объявление</h1>
        <form id="listing-form">
          <div class="field">
            <label for="f-title">Заголовок</label>
            <input type="text" id="f-title" required maxlength="90" placeholder="Например, «Горный велосипед Trek 2021»" />
          </div>
          <div class="field-row">
            <div class="field">
              <label for="f-category">Категория</label>
              <select id="f-category" required></select>
            </div>
            <div class="field">
              <label for="f-condition">Состояние</label>
              <select id="f-condition" required>
                <option value="new">Новое</option>
                <option value="used">Б/у</option>
              </select>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="f-price">Цена, ₸</label>
              <input type="number" id="f-price" required min="0" step="1" />
            </div>
            <div class="field">
              <label for="f-city">Город</label>
              <input type="text" id="f-city" list="cities-list" required />
              <datalist id="cities-list"></datalist>
            </div>
          </div>
          <div class="field">
            <label for="f-description">Описание</label>
            <textarea id="f-description" required rows="6" maxlength="2000"></textarea>
          </div>
          <div class="field">
            <label for="f-tags">Теги (через запятую)</label>
            <input type="text" id="f-tags" placeholder="горный, trek, 29 дюймов" />
          </div>
          <div class="field">
            <label for="f-images">Ссылки на фото (по одной в строке)</label>
            <textarea id="f-images" rows="3" placeholder="https://…"></textarea>
            <p class="field-hint">Загрузка файлов не используется в этом проекте — укажите прямые ссылки на изображения.</p>
          </div>
          <div class="flex-between gap-8">
            <button type="submit" class="btn btn-primary" id="submit-btn">Опубликовать</button>
            <button type="button" class="btn btn-ghost" onclick="history.back()">Отмена</button>
          </div>
          <p class="auth-note" id="form-msg"></p>
        </form>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <span>© 2026 OTIVA</span>
    <span>Доска объявлений</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.js"></script>
<script type="module" src="../js/listing-form.js"></script>
</body>
</html>
