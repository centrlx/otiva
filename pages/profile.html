<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>try{var t=localStorage.getItem("otiva_theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<title>Личный кабинет — OTIVA</title>
<link rel="stylesheet" href="../css/styles.css" />
<link rel="stylesheet" href="../css/profile.css" />
</head>
<body>
<header class="site-header" id="app-header"></header>

<main>
  <section class="page-hero">
    <div class="container">
      <h1>Личный кабинет</h1>
      <p id="hero-sub"></p>
    </div>
  </section>

  <section class="section">
    <div class="container profile-layout">
      <div>
        <div class="tabs">
          <button class="tab is-active" data-tab="listings" type="button">Мои объявления</button>
          <button class="tab" data-tab="favorites" type="button">Избранное</button>
          <button class="tab" data-tab="history" type="button">История</button>
          <button class="tab" data-tab="reviews" type="button">Мои отзывы</button>
        </div>

        <div id="listings-panel" class="panel"></div>
        <div id="favorites-panel" class="panel" hidden></div>
        <div id="history-panel" class="panel" hidden></div>
        <div id="reviews-panel" class="panel" hidden></div>
      </div>

      <aside class="card profile-card">
        <h3>Профиль</h3>
        <form id="profile-form">
          <div class="field">
            <label for="p-name">Имя</label>
            <input type="text" id="p-name" required />
          </div>
          <div class="field">
            <label for="p-city">Город</label>
            <input type="text" id="p-city" list="p-cities" />
            <datalist id="p-cities"></datalist>
          </div>
          <div class="field">
            <label for="p-phone">Телефон</label>
            <input type="tel" id="p-phone" />
          </div>
          <div class="field">
            <label>Email</label>
            <input type="email" id="p-email" disabled />
          </div>
          <button class="btn btn-secondary btn-block" type="submit">Сохранить</button>
          <p class="auth-note" id="profile-msg"></p>
        </form>
        <button class="btn btn-ghost btn-block" id="logout-btn" type="button" style="margin-top:10px;">Выйти</button>
      </aside>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <span>© 2026 OTIVA</span>
    <span>Доска объявлений</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.js"></script>
<script type="module" src="../js/profile.js"></script>
</body>
</html>
